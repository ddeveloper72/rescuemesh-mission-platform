version: '3.9'

services:
  # PostgreSQL with PostGIS extension
  db:
    image: postgis/postgis:15-3.3
    container_name: rescuemesh_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rescuemesh
      POSTGRES_USER: rescuemesh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rescuemesh_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/sql:/docker-entrypoint-initdb.d  # Optional: SQL init scripts
      - ./data/fixtures:/fixtures:ro  # Read-only fixture data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuemesh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rescuemesh_network

  # Django REST API + Simulation Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescuemesh_backend
    restart: unless-stopped
    command: /app/docker-entrypoint.sh
    volumes:
      - ./backend:/app
      - ./data:/data:ro  # Read-only access to fixture data
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-changeme-in-production}
      - DATABASE_URL=postgres://rescuemesh:${DB_PASSWORD:-rescuemesh_dev}@db:5432/rescuemesh
      - DB_NAME=rescuemesh
      - DB_USER=rescuemesh
      - DB_PASSWORD=${DB_PASSWORD:-rescuemesh_dev}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4321}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rescuemesh_network

  # Astro Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rescuemesh_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules
      - /app/.astro  # Cache Astro build artifacts
      - /app/dist  # Prevent overwriting built production files
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    environment:
      - PUBLIC_DJANGO_API_BASE_URL=http://backend:8000/api/v1
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - backend
    networks:
      - rescuemesh_network

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  rescuemesh_network:
    driver: bridge
